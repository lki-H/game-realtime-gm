name: Verify local PVE
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache-dependency-path: backend/go.sum
      - name: Tests and vet
        working-directory: backend
        run: |
          go test ./...
          go vet ./...
      - name: Isolated integration and race
        shell: bash
        run: |
          export PVE_TEST_PASSWORD="$(openssl rand -hex 32)"
          export PVE_INTEGRATION=1 GIN_MODE=release
          trap 'docker compose -p gm-ci-v2 -f deploy/docker-compose.v2-test.yml down -v' EXIT
          docker compose -p gm-ci-v2 -f deploy/docker-compose.v2-test.yml up -d --wait
          cd backend
          go test -race -count=1 -timeout 300s ./tests/v2
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [gm-admin, pve-demo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - working-directory: frontend/${{ matrix.app }}
        run: npm ci --ignore-scripts
      - working-directory: frontend/${{ matrix.app }}
        run: npm run build
