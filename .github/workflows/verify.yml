name: Verify local PVE
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache-dependency-path: backend/go.sum
      - name: Tests and vet
        working-directory: backend
        run: |
          go test ./...
          go vet ./...
      - name: Isolated integration and race
        shell: bash
        working-directory: backend
        run: |
          export PVE_TEST_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$PVE_TEST_PASSWORD"
          export PVE_INTEGRATION=1 GIN_MODE=release
          compose_file="$GITHUB_WORKSPACE/deploy/docker-compose.v2-test.yml"
          trap 'docker compose -p gm-ci-v2 -f "$compose_file" down -v' EXIT
          docker compose -p gm-ci-v2 -f "$compose_file" up -d --wait --wait-timeout 150
          rollback_sha=64a4263648849586dfad9013d49a664f76181e55
          git fetch --no-tags --depth=1 origin "$rollback_sha"
          rollback_source="$RUNNER_TEMP/r3-rollback-source"
          mkdir -p "$rollback_source"
          git archive "$rollback_sha" | tar -x -C "$rollback_source"
          export PVE_R4_SERVER_BINARY="$RUNNER_TEMP/pve-r4-server"
          export PVE_R3_SERVER_BINARY="$RUNNER_TEMP/pve-r3-server"
          go build -o "$PVE_R4_SERVER_BINARY" ./cmd/server
          (cd "$rollback_source/backend" && go build -o "$PVE_R3_SERVER_BINARY" ./cmd/server)
          go test -race -count=1 -timeout 300s ./tests/v2
      - name: Build service image
        run: |
          docker build --tag "game-realtime-gm:r4-$GITHUB_SHA" backend
          docker image inspect --format '{{.Id}}' "game-realtime-gm:r4-$GITHUB_SHA"
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [gm-admin, pve-demo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - working-directory: frontend/${{ matrix.app }}
        run: npm ci --ignore-scripts
      - working-directory: frontend/${{ matrix.app }}
        run: npm run build
