syntax = "proto3";
package pve.reporting.v1;
option go_package = "game-realtime-gm/experiments/r5-m6/gen/reporting/v1;reportingv1";
option csharp_namespace = "Pve.Reporting.V1";

service Reporting {
  rpc GetLeaderboard(GetLeaderboardRequest) returns (GetLeaderboardResponse);
  rpc GetRunResult(GetRunResultRequest) returns (GetRunResultResponse);
}

message GetLeaderboardRequest { uint32 limit = 1; }
message LeaderboardEntry {
  int64 player_id = 1;
  int64 score = 2;
  uint32 rank = 3;
}
message GetLeaderboardResponse { repeated LeaderboardEntry entries = 1; }
message GetRunResultRequest {
  string run_id = 1;
  int64 player_id = 2;
}
message ParticipantResult {
  int64 player_id = 1;
  bool contribution_qualified = 2;
  bool task_completed = 3;
  int64 reward = 4;
  string settled_at = 5;
}
message GetRunResultResponse {
  string run_id = 1;
  string operation = 2;
  string difficulty = 3;
  string end_reason = 4;
  repeated ParticipantResult participants = 5;
}
