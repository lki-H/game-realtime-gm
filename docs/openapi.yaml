openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Game Realtime GM HTTP API
  version: 2.0.0
  summary: 当前单体 Go 服务的 HTTP 机器契约
  description: |
    本文件描述 `backend/internal/router/router.go` 中的 legacy 公共 HTTP 及 V2 查询接口。
    V2 路径仅在 GAMEPLAY_MODE=v2 中注册，内部事件监听器不属于公共契约。
    所有 HTTP 响应都包含 `X-Request-ID` 响应头。WebSocket `/ws` 的连接与消息契约
    由 `docs/ws-protocol.md` 单独维护，不在 OpenAPI 中建模业务消息。
externalDocs:
  description: WebSocket JSON protocol
  url: ./ws-protocol.md
x-document-metadata:
  role: HTTP 机器可读契约
  authority: L1
  status: 已实现
  scope: 当前 Go 单体服务 HTTP 路由
  fact-source: backend/internal/router/router.go 与当前 Handler
  last-updated: 2026-10-06
servers:
  - url: http://localhost:8080
    description: 本地开发服务
tags:
  - name: Health
  - name: Authentication
  - name: Player
  - name: Presence
  - name: Leaderboard
  - name: Admin
  - name: Admin Audit
  - name: Admin Observation
  - name: V2 PVE
  - name: Admin V2 PVE

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: 健康检查
      description: 只证明 Go HTTP 进程能够响应，不检查 MySQL、Redis 或业务状态。
      security: []
      responses:
        "200":
          description: Go HTTP 服务正常响应
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                code: 0
                message: ok

  /api/register:
    post:
      tags: [Authentication]
      operationId: registerPlayer
      summary: 注册玩家
      description: 在同一个 MySQL 事务中创建玩家与零余额资产行。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              username: player01
              password: "123456"
              nickname: 玩家01
      x-error-codes:
        - {status: 400, code: 40001, message: invalid request}
        - {status: 409, code: 40901, message: username already exists}
        - {status: 500, code: 50001, message: generate password hash failed}
        - {status: 500, code: 50002, message: create player failed}
      responses:
        "201":
          description: 注册成功
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/login:
    post:
      tags: [Authentication]
      operationId: loginPlayer
      summary: 玩家登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              username: player01
              password: "123456"
      x-error-codes:
        - {status: 400, code: 40001, message: invalid request}
        - {status: 401, code: 40101, message: username or password is wrong}
        - {status: 403, code: 40321, message: player is banned}
        - {status: 500, code: 50003, message: query player failed}
        - {status: 500, code: 50004, message: generate token failed}
      responses:
        "200":
          description: 登录成功并返回 24 小时玩家 JWT
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerLoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/login:
    post:
      tags: [Authentication]
      operationId: loginAdmin
      summary: 管理员登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
            example:
              username: admin
              password: local-development-password
      x-error-codes:
        - {status: 400, code: 40011, message: invalid request}
        - {status: 401, code: 40111, message: username or password is wrong}
        - {status: 500, code: 50031, message: query admin failed}
        - {status: 500, code: 50032, message: generate admin token failed}
      responses:
        "200":
          description: 登录成功并返回 24 小时管理员 JWT
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/me:
    get:
      tags: [Player]
      operationId: getCurrentPlayer
      summary: 查询当前玩家
      security:
        - PlayerBearer: []
      x-error-codes:
        - {status: 404, code: 40401, message: player not found}
        - {status: 500, code: 50010, message: query player failed}
      responses:
        "200":
          $ref: "#/components/responses/PlayerSuccess"
        "401":
          $ref: "#/components/responses/PlayerUnauthorized"
        "403":
          $ref: "#/components/responses/PlayerForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/me/nickname:
    patch:
      tags: [Player]
      operationId: updateCurrentPlayerNickname
      summary: 修改当前玩家昵称
      security:
        - PlayerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNicknameRequest"
            example:
              nickname: 新昵称
      x-error-codes:
        - {status: 400, code: 40002, message: invalid request}
        - {status: 400, code: 40003, message: nickname cannot be empty}
        - {status: 404, code: 40401, message: player not found}
        - {status: 500, code: 50011, message: update nickname failed}
      responses:
        "200":
          $ref: "#/components/responses/PlayerSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/PlayerUnauthorized"
        "403":
          $ref: "#/components/responses/PlayerForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/players:
    get:
      tags: [Player]
      operationId: listPlayersForPlayer
      summary: 玩家侧分页查询玩家
      security:
        - PlayerBearer: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Keyword"
      x-error-codes:
        - {status: 500, code: 50013, message: count players failed}
        - {status: 500, code: 50014, message: query player list failed}
        - {status: 500, code: 50015, message: scan player failed}
        - {status: 500, code: 50016, message: read player rows failed}
      responses:
        "200":
          description: 玩家分页结果；非法分页值回退默认值，page_size 最大 50
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerListResponse"
        "401":
          $ref: "#/components/responses/PlayerUnauthorized"
        "403":
          $ref: "#/components/responses/PlayerForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/players/{id}:
    get:
      tags: [Player]
      operationId: getPlayerByIdForPlayer
      summary: 玩家侧查询玩家详情
      security:
        - PlayerBearer: []
      parameters:
        - $ref: "#/components/parameters/PlayerId"
      x-error-codes:
        - {status: 400, code: 40004, message: invalid player id}
        - {status: 404, code: 40401, message: player not found}
        - {status: 500, code: 50012, message: query player failed}
      responses:
        "200":
          $ref: "#/components/responses/PlayerSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/PlayerUnauthorized"
        "403":
          $ref: "#/components/responses/PlayerForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/online/heartbeat:
    post:
      tags: [Presence]
      operationId: heartbeatCurrentPlayer
      summary: 续期玩家在线状态
      security:
        - PlayerBearer: []
      x-error-codes:
        - {status: 500, code: 50020, message: update online status failed}
      responses:
        "200":
          description: Redis 在线 key 已写入，TTL 为 120 秒
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnlineHeartbeatResponse"
        "401":
          $ref: "#/components/responses/PlayerUnauthorized"
        "403":
          $ref: "#/components/responses/PlayerForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/online/status:
    get:
      tags: [Presence]
      operationId: getCurrentPlayerOnlineStatus
      summary: 查询当前玩家在线状态
      security:
        - PlayerBearer: []
      x-error-codes:
        - {status: 500, code: 50021, message: query online status failed}
      responses:
        "200":
          description: 根据 Redis online key 是否存在返回结果
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnlineStatusResponse"
        "401":
          $ref: "#/components/responses/PlayerUnauthorized"
        "403":
          $ref: "#/components/responses/PlayerForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/leaderboards/{mission_id}:
    get:
      tags: [Leaderboard]
      operationId: listLeaderboard
      summary: 查询任务 Top N 排行榜
      description: 返回 Redis 中每名玩家的个人最佳分；分数高者优先，同分先达到者优先。
      security:
        - PlayerBearer: []
      parameters:
        - $ref: "#/components/parameters/MissionId"
        - $ref: "#/components/parameters/LeaderboardLimit"
      x-error-codes:
        - {status: 400, code: 40090, message: invalid leaderboard mission_id}
        - {status: 500, code: 50090, message: query leaderboard failed}
      responses:
        "200":
          description: 排行榜条目
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/PlayerUnauthorized"
        "403":
          $ref: "#/components/responses/PlayerForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/leaderboards/{mission_id}/me:
    get:
      tags: [Leaderboard]
      operationId: getCurrentPlayerLeaderboardEntry
      summary: 查询当前玩家排名
      security:
        - PlayerBearer: []
      parameters:
        - $ref: "#/components/parameters/MissionId"
      x-error-codes:
        - {status: 400, code: 40090, message: invalid leaderboard mission_id}
        - {status: 404, code: 40490, message: player not ranked}
        - {status: 500, code: 50090, message: query leaderboard failed}
      responses:
        "200":
          description: 当前玩家最佳成绩与排名
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardEntryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/PlayerUnauthorized"
        "403":
          $ref: "#/components/responses/PlayerForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/me/mission-records:
    get:
      tags: [Leaderboard]
      operationId: listCurrentPlayerMissionRecords
      summary: 分页查询当前玩家战绩
      security:
        - PlayerBearer: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      x-error-codes:
        - {status: 500, code: 50091, message: query mission history failed}
      responses:
        "200":
          description: 当前玩家参与的 settled 任务历史
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryPageResponse"
        "401":
          $ref: "#/components/responses/PlayerUnauthorized"
        "403":
          $ref: "#/components/responses/PlayerForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/me:
    get:
      tags: [Admin]
      operationId: getCurrentAdmin
      summary: 查询当前管理员身份
      security:
        - AdminBearer: []
      x-error-codes:
        - {status: 401, code: 40115, message: admin identity missing}
      responses:
        "200":
          description: 当前管理员 JWT 中的身份
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIdentityResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"

  /api/admin/dashboard/summary:
    get:
      tags: [Admin]
      operationId: getAdminDashboardSummary
      summary: 查询 GM Dashboard 摘要
      security:
        - AdminBearer: []
      x-error-codes:
        - {status: 500, code: 50091, message: count total players failed}
        - {status: 500, code: 50092, message: count normal players failed}
        - {status: 500, code: 50093, message: count banned players failed}
        - {status: 500, code: 50094, message: count today new players failed}
        - {status: 500, code: 50095, message: count online players failed}
        - {status: 500, code: 50096, message: count today admin operations failed}
      responses:
        "200":
          description: MySQL 玩家/审计统计与 Redis 在线 key 统计
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummaryResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/dashboard/recent-operation-logs:
    get:
      tags: [Admin Audit]
      operationId: listRecentAdminOperationLogs
      summary: 查询最近 GM 操作日志
      security:
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/RecentLogLimit"
      x-error-codes:
        - {status: 500, code: 50101, message: query recent operation logs failed}
        - {status: 500, code: 50102, message: scan recent operation log failed}
        - {status: 500, code: 50103, message: read recent operation log rows failed}
      responses:
        "200":
          description: 按 ID 倒序的最近日志，limit 最大 20
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecentOperationLogsResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/players:
    get:
      tags: [Admin]
      operationId: listPlayersForAdmin
      summary: GM 分页查询玩家
      security:
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Keyword"
      x-error-codes:
        - {status: 500, code: 50041, message: count players failed}
        - {status: 500, code: 50042, message: query player list failed}
        - {status: 500, code: 50043, message: scan player failed}
        - {status: 500, code: 50044, message: read player rows failed}
      responses:
        "200":
          description: 玩家分页结果；成功后 best-effort 记录查询审计
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerListResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/players/{id}:
    get:
      tags: [Admin]
      operationId: getPlayerByIdForAdmin
      summary: GM 查询玩家详情
      security:
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/PlayerId"
      x-error-codes:
        - {status: 400, code: 40041, message: invalid player id}
        - {status: 404, code: 40441, message: player not found}
        - {status: 500, code: 50045, message: query player failed}
      responses:
        "200":
          $ref: "#/components/responses/PlayerSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/players/{id}/ban:
    post:
      tags: [Admin]
      operationId: banPlayer
      summary: 封禁玩家
      description: 玩家状态变化与 GM 审计记录在同一个 MySQL 事务提交。
      security:
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/PlayerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
            example:
              reason: 违规行为
      x-error-codes:
        - {status: 400, code: 40051, message: invalid player id}
        - {status: 400, code: 40052, message: invalid request}
        - {status: 400, code: 40053, message: ban reason cannot be empty}
        - {status: 400, code: 40054, message: ban reason is too long}
        - {status: 401, code: 40116, message: admin identity missing}
        - {status: 404, code: 40451, message: player not found}
        - {status: 409, code: 40951, message: player already banned}
        - {status: 500, code: 50051, message: begin transaction failed}
        - {status: 500, code: 50052, message: query player status failed}
        - {status: 500, code: 50053, message: ban player failed}
        - {status: 500, code: 50054, message: record ban operation failed}
        - {status: 500, code: 50055, message: commit transaction failed}
      responses:
        "200":
          $ref: "#/components/responses/PlayerSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/players/{id}/unban:
    post:
      tags: [Admin]
      operationId: unbanPlayer
      summary: 解封玩家
      description: 玩家状态变化与 GM 审计记录在同一个 MySQL 事务提交。
      security:
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/PlayerId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
            example:
              reason: 申诉通过
      x-error-codes:
        - {status: 400, code: 40061, message: invalid player id}
        - {status: 400, code: 40062, message: invalid request}
        - {status: 400, code: 40063, message: unban reason cannot be empty}
        - {status: 400, code: 40064, message: unban reason is too long}
        - {status: 404, code: 40461, message: player not found}
        - {status: 409, code: 40961, message: player is not banned}
        - {status: 500, code: 50061, message: begin transaction failed}
        - {status: 500, code: 50062, message: query player status failed}
        - {status: 500, code: 50063, message: unban player failed}
        - {status: 500, code: 50064, message: record unban operation failed}
        - {status: 500, code: 50065, message: commit transaction failed}
      responses:
        "200":
          $ref: "#/components/responses/PlayerSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/admin/operation-log-actions:
    get:
      tags: [Admin Audit]
      operationId: listAdminOperationLogActions
      summary: 查询 GM 审计动作选项
      security:
        - AdminBearer: []
      responses:
        "200":
          description: 当前代码支持的审计动作筛选项
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationLogActionsResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminForbidden"

  /api/admin/operation-logs:
    get:
      tags: [Admin Audit]
      operationId: listAdminOperationLogs
      summary: 分页筛选 GM 操作日志
      security:
        - AdminBearer: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: action
          in: query
          schema: {type: string}
        - name: admin_username
          in: query
          schema: {type: string}
        - name: target_type
          in: query
          schema: {type: string}
        - name: target_id
          in: query
          schema: {type: integer, format: int64, minimum: 1}
        - name: start_time
          in: query
          schema: {type: string, format: date-time}
        - name: end_time
          in: query
          schema: {type: string, format: date-time}
        - name: range
          in: query
          description: 仅在未提供 start_time/end_time 时生效
          schema:
            type: string
            enum: [today, last_7_days, last_30_days]
      x-error-codes:
        - {status: 400, code: 40071, message: invalid target id}
        - {status: 400, code: 40072, message: invalid start_time}
        - {status: 400, code: 40073, message: invalid end_time}
        - {status: 400, code: 40074, message: start_time cannot be after end_time}
        - {status: 400, code: 40075, message: invalid range}
        - {status: 500, code: 50071, message: count operation logs failed}
        - {status: 500, code: 50072, message: query operation logs failed}
        - {status: 500, code: 50073, message: scan operation log failed}
        - {status: 500, code: 50074, message: read operation log rows failed}
      responses:
        "200":
          description: 审计日志分页结果
