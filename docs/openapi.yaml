  /api/admin/v2/observations/{entity}:
    get:
      tags: [Admin V2 PVE]
      operationId: getV2Observation
      summary: 查询 V2 只读观察数据
      security: [{AdminBearer: []}]
      parameters:
        - {name: entity, in: path, required: true, schema: {type: string, enum: [parties, proposals, runs, tasks, pending]}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
      responses:
        "200": {description: data为观察列表，pagination包含page/page_size/total，observed_at为UTC查询时间}
        "400": {description: code 40070，非法分页值被拒绝}
  /api/admin/v2/metrics:
    get:
      tags: [Admin V2 PVE]
      operationId: getV2Metrics
      summary: Prometheus 兼容业务指标
      security: [{AdminBearer: []}]
      responses: {"200": {description: Prometheus metrics}}
  /api/admin/v2/operations/{operation_id}/retry:
    post:
      tags: [Admin V2 PVE]
      operationId: retryV2SettlementOperation
      summary: 故障修复后重试已耗尽重试次数的结算
      description: 实时查询管理员身份，仅 operator 角色可调用。目标必须为 needs_repair 的 settlement 操作、Run 仍 ending 且参与者资产存在。重复修复 operation_id 不重复重置或写审计，不直接发币。
      security: [{AdminBearer: []}]
      parameters:
        - {name: operation_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation_id, expected_attempts, reason]
              properties:
                operation_id: {type: string, minLength: 8, maxLength: 120, description: 本次修复的稳定意图键}
                expected_attempts: {type: integer, minimum: 1, description: 查询观察接口所得的原操作尝试次数}
                reason: {type: string, minLength: 1, maxLength: 512, description: 故障原因与修复说明，服务端限制为512字节}
      responses:
        "200": {description: 原操作重新进入 pending，修复回执与审计已持久化}
        "400": {description: 修复请求无效}
        "401": {description: 管理员身份无效}
        "403": {description: 玩家、普通GM或已撤销角色没有修复权限}
        "404": {description: 目标操作或Run不存在}
        "409": {description: 状态或尝试版本冲突、故障未消除、同修复键不同内容}
        "429": {description: 超出入口限流，code 42970}
        "500": {description: 事务或审计失败，没有提交修复}

components:
  securitySchemes:
    PlayerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 仅接受 `subject_type=player` 且 `player_id>0` 的 HS256 JWT。
    AdminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 仅接受 `subject_type=admin` 且 `admin_id>0` 的 HS256 JWT。

  headers:
    RequestId:
      description: 经校验的请求追踪 ID；非法或缺失时由服务端生成。
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[A-Za-z0-9_.-]+$"

  parameters:
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: page_size
      in: query
      description: 非法值回退 10，超过 50 时截断为 50。
      schema: {type: integer, minimum: 1, maximum: 50, default: 10}
    Keyword:
      name: keyword
      in: query
      description: 按 username 或 nickname 做 LIKE 查询。
      schema: {type: string}
    PlayerId:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    MissionId:
      name: mission_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[A-Za-z0-9_.-]+$"
    LeaderboardLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 50, default: 10}
    RecentLogLimit:
      name: limit
      in: query
      description: 非法值回退 10，超过 20 时截断为 20。
      schema: {type: integer, minimum: 1, maximum: 20, default: 10}

  responses:
    BadRequest:
      description: 请求参数或请求体不符合当前业务约束；具体 code 见 operation 的 `x-error-codes`。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 登录凭据错误或缺少有效身份。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 身份类型不允许或账号被封禁。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PlayerUnauthorized:
      description: 玩家 Authorization 缺失、格式错误或 token 无效（40102/40103/40104）。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            missing:
              value: {code: 40102, message: authorization header missing}
            invalidHeader:
              value: {code: 40103, message: invalid authorization header}
            invalidToken:
              value: {code: 40104, message: invalid token}
    PlayerForbidden:
      description: token 不是玩家身份（40301）。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example: {code: 40301, message: player permission required}
    AdminUnauthorized:
      description: 管理员 Authorization 缺失、格式错误或 token 无效（40112/40113/40114）。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            missing:
              value: {code: 40112, message: authorization header missing}
            invalidHeader:
              value: {code: 40113, message: invalid authorization header}
            invalidToken:
              value: {code: 40114, message: invalid token}
    AdminForbidden:
      description: token 不是管理员身份（40311）。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example: {code: 40311, message: admin permission required}
    NotFound:
      description: 资源不存在；具体 code 见 operation 的 `x-error-codes`。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 唯一性或当前业务状态冲突；具体 code 见 operation 的 `x-error-codes`。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: 数据源或内部操作失败；具体 code 见 operation 的 `x-error-codes`。
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PlayerSuccess:
      description: 玩家数据
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PlayerResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: {type: integer}
        message: {type: string}
        data:
          description: 仅部分错误返回，例如封禁原因。
    HealthResponse:
      type: object
      required: [code, message]
      properties:
        code: {type: integer, const: 0}
        message: {type: string, const: ok}
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, password, nickname]
      properties:
        username: {type: string, minLength: 3, maxLength: 64}
        password: {type: string, minLength: 6, maxLength: 72, writeOnly: true}
        nickname: {type: string, minLength: 1, maxLength: 64}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 1}
        password: {type: string, minLength: 1, writeOnly: true}
    AdminLoginRequest:
      $ref: "#/components/schemas/LoginRequest"
    UpdateNicknameRequest:
      type: object
      additionalProperties: false
      required: [nickname]
      properties:
        nickname: {type: string, minLength: 1, maxLength: 64}
    ReasonRequest:
      type: object
      additionalProperties: false
