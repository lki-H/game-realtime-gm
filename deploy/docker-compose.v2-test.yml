services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: ${PVE_TEST_PASSWORD:?Set a temporary PVE_TEST_PASSWORD}
      MYSQL_DATABASE: game_realtime_v2_test
      MYSQL_USER: pve_test
      MYSQL_PASSWORD: ${PVE_TEST_PASSWORD}
    ports:
      - "127.0.0.1:23306:3306"
    command: ["--default-time-zone=+00:00"]
    volumes:
      - ../backend/internal/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./v2-test-init.sql:/docker-entrypoint-initdb.d/02-isolated-migration-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h127.0.0.1 -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1' >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:26379:6379"
