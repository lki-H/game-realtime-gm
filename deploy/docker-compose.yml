services:
  postgres:
    image: postgres:16
    container_name: game_realtime_postgres
    environment:
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game123456
      POSTGRES_DB: game_realtime
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: game_realtime_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: