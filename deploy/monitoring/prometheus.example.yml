global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: pve
    metrics_path: /metrics
    static_configs:
      - targets: [host.docker.internal:8091]
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics-token
